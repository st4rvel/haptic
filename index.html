<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TETHER — Dynamic Haptic & Visual Impact Player</title>
  <style>
    * { box-sizing: border-box; }
    
    body {
      margin: 0;
      background: #08080a;
      color: #eaeaea;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 860px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* Screen shake container */
    .video-viewport {
      width: 100%;
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transform: translate3d(0, 0, 0);
      will-change: transform;
    }

    .video-wrapper {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    #player {
      width: 100%;
      height: 100%;
    }

    /* Impact flash overlay */
    .impact-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0;
      mix-blend-mode: screen;
      z-index: 10;
      transition: opacity 0.05s ease-out;
    }

    /* Hud Status Controls */
    .haptic-panel {
      margin-top: 18px;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      background: #121217;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .pulse-indicator {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #444;
      margin-right: 8px;
      transition: background 0.15s ease, box-shadow 0.15s ease;
    }

    .pulse-indicator.active {
      background: #00e676;
      box-shadow: 0 0 10px #00e676;
    }

    .status-text {
      font-size: 13px;
      font-weight: 500;
      color: #aaa;
    }

    .feedback-label {
      font-size: 12px;
      color: #ff9100;
      font-family: monospace;
    }

    .note {
      font-size: 12px;
      color: #666;
      margin-top: 10px;
      text-align: center;
    }

    /* --- Visual FX Animations --- */
    
    /* 1. Heavy Slam Shake (Title Drop & Starvel Slam) */
    .shake-heavy {
      animation: heavyShake 0.4s cubic-bezier(.36,.07,.19,.97) both;
    }

    @keyframes heavyShake {
      10%, 90% { transform: translate3d(-3px, 2px, 0) scale(1.01); }
      20%, 80% { transform: translate3d(4px, -3px, 0); }
      30%, 50%, 70% { transform: translate3d(-5px, 4px, 0) scale(1.02); }
      40%, 60% { transform: translate3d(5px, -2px, 0); }
    }

    /* 2. Snappy Pulse / Jolt (Countdown Beeps & Glitches) */
    .shake-pulse {
      animation: pulseJolt 0.16s ease-out both;
    }

    @keyframes pulseJolt {
      0% { transform: scale(1); }
      50% { transform: scale(0.985) translate3d(0, 1px, 0); }
      100% { transform: scale(1) translate3d(0, 0, 0); }
    }

    /* 3. Flash Overlays */
    .flash-white {
      background: rgba(255, 255, 255, 0.4);
      opacity: 1 !important;
    }

    .flash-cyan {
      background: radial-gradient(circle, rgba(0, 229, 255, 0.45) 0%, rgba(0, 0, 0, 0) 75%);
      opacity: 1 !important;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Viewport wrapper isolates the shaking effect to the player -->
  <div class="video-viewport" id="viewport">
    <div class="video-wrapper">
      <div id="player"></div>
    </div>
    <div class="impact-overlay" id="flashOverlay"></div>
  </div>

  <div class="haptic-panel">
    <div>
      <span id="indicator" class="pulse-indicator"></span>
      <span id="status" class="status-text">Detecting device...</span>
    </div>
    <div id="cueFeedback" class="feedback-label">STANDBY</div>
  </div>

  <p class="note" id="deviceModeNote"></p>
</div>

<script>
  const VIDEO_ID = 't_P2gRGizco';

  // Check hardware vibration support
  const hasHaptics = 'vibrate' in navigator;

  // SFX Cue Mapping with visual FX types
  const hapticCues = [
    { time: 7.90,  pattern: [90, 40, 60], visual: 'pulse', flash: 'cyan', label: "Hologram Boot & Sub-Bass" },
    { time: 11.50, pattern: [40],         visual: 'pulse', flash: null,   label: "Pulse: Five" },
    { time: 12.80, pattern: [40],         visual: 'pulse', flash: null,   label: "Pulse: Four" },
    { time: 14.10, pattern: [40],         visual: 'pulse', flash: null,   label: "Pulse: Three" },
    { time: 15.50, pattern: [50],         visual: 'pulse', flash: 'white',label: "Pulse: Two / Combat Hit" },
    { time: 16.70, pattern: [60],         visual: 'pulse', flash: 'cyan', label: "Pulse: One / Distortion" },
    { time: 18.00, pattern: [120, 40, 180], visual: 'heavy', flash: 'white',label: "STARVEL Logo Slam" },
    { time: 24.80, pattern: [80, 50, 220],  visual: 'heavy', flash: 'white',label: "TETHER Title Hit" },
    { time: 29.30, pattern: [25],          visual: 'pulse', flash: null,   label: "Clock Tick" }
  ];

  let player;
  let animFrameId = null;

  // Set mode messaging on load
  const noteEl = document.getElementById('deviceModeNote');
  const statusEl = document.getElementById('status');
  if (hasHaptics) {
    noteEl.textContent = "Mode: Hardware Vibration Active (Android / Supported browser).";
    statusEl.textContent = "Haptics: Ready";
  } else {
    noteEl.textContent = "Mode: Visual Haptic Fallback Active (Screen-shake & flash enabled for iOS/Desktop).";
    statusEl.textContent = "Visual Fallback: Ready";
  }

  // Load YouTube IFrame API
  const tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);

  function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
      videoId: VIDEO_ID,
      playerVars: {
        'playsinline': 1,
        'rel': 0,
        'modestbranding': 1
      },
      events: {
        'onStateChange': onPlayerStateChange
      }
    });
  }

  function triggerImpact(cue) {
    // 1. Physical Haptics (Android/Supported)
    if (hasHaptics) {
      navigator.vibrate(cue.pattern);
    }

    // 2. Visual Haptics (Runs on iOS, Desktop, and reinforces Android)
    const viewport = document.getElementById('viewport');
    const overlay = document.getElementById('flashOverlay');

    // Remove existing animation classes to re-trigger cleanly
    viewport.classList.remove('shake-heavy', 'shake-pulse');
    overlay.className = 'impact-overlay';

    // Force reflow so rapid triggers register immediately
    void viewport.offsetWidth;

    if (cue.visual === 'heavy') {
      viewport.classList.add('shake-heavy');
    } else if (cue.visual === 'pulse') {
      viewport.classList.add('shake-pulse');
    }

    if (cue.flash === 'white') {
      overlay.classList.add('flash-white');
      setTimeout(() => overlay.classList.remove('flash-white'), 100);
    } else if (cue.flash === 'cyan') {
      overlay.classList.add('flash-cyan');
      setTimeout(() => overlay.classList.remove('flash-cyan'), 120);
    }

    // HUD Indicator
    const indicator = document.getElementById('indicator');
    const feedback = document.getElementById('cueFeedback');
    indicator.classList.add('active');
    feedback.textContent = cue.label.toUpperCase();

    setTimeout(() => {
      indicator.classList.remove('active');
    }, 150);
  }

  function syncLoop() {
    if (!player || typeof player.getCurrentTime !== 'function') return;

    const currentTime = player.getCurrentTime();

    hapticCues.forEach(cue => {
      if (!cue.triggered && currentTime >= cue.time && currentTime < cue.time + 0.12) {
        triggerImpact(cue);
        cue.triggered = true;
      }

      if (currentTime < cue.time - 0.2) {
        cue.triggered = false;
      }
    });

    animFrameId = requestAnimationFrame(syncLoop);
  }

  function onPlayerStateChange(event) {
    if (event.data === YT.PlayerState.PLAYING) {
      statusEl.textContent = hasHaptics ? "Haptics: Active & Synced" : "Visual Fallback: Active";
      if (!animFrameId) {
        animFrameId = requestAnimationFrame(syncLoop);
      }
    } else {
      if (animFrameId) {
        cancelAnimationFrame(animFrameId);
        animFrameId = null;
      }
      statusEl.textContent = event.data === YT.PlayerState.PAUSED ? "Paused" : "Standby";
    }
  }
</script>

</body>
</html>
