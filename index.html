<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TETHER — F1-Style Haptic Trailer Experience</title>
  <style>
    * { box-sizing: border-box; }
    
    body {
      margin: 0;
      background: #050507;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    .experience-card {
      width: 100%;
      max-width: 880px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* Screen shake viewport */
    .viewport-box {
      width: 100%;
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      background: #000;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.9);
      transform: translate3d(0, 0, 0);
      will-change: transform;
    }

    .video-aspect {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%; /* 16:9 */
      height: 0;
    }

    .video-aspect iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Dynamic Visual Shockwave / Flash */
    .flash-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      mix-blend-mode: screen;
      z-index: 10;
      transition: opacity 0.05s ease-out;
    }

    /* Telemetry HUD (Like F1 experience) */
    .hud-bar {
      margin-top: 14px;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      background: #0e0e13;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .hud-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .telemetry-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #444;
      transition: background 0.1s, box-shadow 0.1s;
    }

    .telemetry-dot.active {
      background: #00ff66;
      box-shadow: 0 0 12px #00ff66;
    }

    .hud-status {
      font-size: 13px;
      letter-spacing: 0.5px;
      font-weight: 600;
      color: #999;
      text-transform: uppercase;
    }

    .hud-cue-tag {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      color: #ffaa00;
      letter-spacing: 1px;
    }

    /* Shake Profiles */
    .shake-impact {
      animation: f1Impact 0.35s cubic-bezier(.36,.07,.19,.97) both;
    }
    @keyframes f1Impact {
      10%, 90% { transform: translate3d(-3px, 2px, 0) scale(1.01); }
      20%, 80% { transform: translate3d(4px, -3px, 0); }
      30%, 50%, 70% { transform: translate3d(-5px, 4px, 0) scale(1.02); }
      40%, 60% { transform: translate3d(4px, -2px, 0); }
    }

    .shake-pulse {
      animation: f1Pulse 0.14s ease-out both;
    }
    @keyframes f1Pulse {
      50% { transform: scale(0.988) translate3d(0, 1px, 0); }
      100% { transform: scale(1) translate3d(0, 0, 0); }
    }

    .flash-cyan {
      background: radial-gradient(circle, rgba(0, 229, 255, 0.5) 0%, rgba(0,0,0,0) 70%);
      opacity: 1 !important;
    }
    .flash-white {
      background: rgba(255, 255, 255, 0.45);
      opacity: 1 !important;
    }

    /* Hidden iOS Taptic Driver elements */
    #ios-haptic-trigger {
      position: absolute;
      opacity: 0;
      pointer-events: none;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }
  </style>
</head>
<body>

<div class="experience-card">
  <div class="viewport-box" id="viewport">
    <div class="video-aspect">
      <iframe 
        id="player" 
        src="https://www.youtube-nocookie.com/embed/t_P2gRGizco?enablejsapi=1&playsinline=1&rel=0&modestbranding=1" 
        title="TETHER Teaser" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
        allowfullscreen>
      </iframe>
    </div>
    <div class="flash-overlay" id="flashOverlay"></div>
  </div>

  <div class="hud-bar">
    <div class="hud-left">
      <div class="telemetry-dot" id="dot"></div>
      <span class="hud-status" id="status">Connecting...</span>
    </div>
    <div class="hud-cue-tag" id="cueTag">STANDBY</div>
  </div>
</div>

<!-- iOS Taptic Engine Web Bridge -->
<div id="ios-haptic-trigger">
  <label id="tapticLabel" for="tapticSwitch">
    <input type="checkbox" id="tapticSwitch" switch>
  </label>
</div>

<script>
  const hasAndroidHaptics = 'vibrate' in navigator;
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || 
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  // Exact SFX Cue points mapped to TETHER's audio master
  const sfxTrack = [
    { time: 7.90,  vibe: [90, 40, 60], pulses: 2, fx: 'pulse',  flash: 'cyan',  tag: "HOLOGRAM INIT" },
    { time: 11.50, vibe: [40],         pulses: 1, fx: 'pulse',  flash: null,    tag: "COUNTDOWN: 5" },
    { time: 12.80, vibe: [40],         pulses: 1, fx: 'pulse',  flash: null,    tag: "COUNTDOWN: 4" },
    { time: 14.10, vibe: [40],         pulses: 1, fx: 'pulse',  flash: null,    tag: "COUNTDOWN: 3" },
    { time: 15.50, vibe: [50],         pulses: 1, fx: 'pulse',  flash: 'white', tag: "WARP SHIFT: 2" },
    { time: 16.70, vibe: [70],         pulses: 2, fx: 'pulse',  flash: 'cyan',  tag: "WARP SHIFT: 1" },
    { time: 18.00, vibe: [140, 40, 180], pulses: 3, fx: 'impact', flash: 'white', tag: "STARVEL LOGO SLAM" },
    { time: 24.80, vibe: [90, 40, 240],  pulses: 3, fx: 'impact', flash: 'white', tag: "TETHER TITLE SLAM" },
    { time: 29.30, vibe: [30],         pulses: 1, fx: 'pulse',  flash: null,    tag: "TEMPORAL TICK" }
  ];

  let player;
  let syncClock = null;
  const tapticLabel = document.getElementById('tapticLabel');
  const viewport = document.getElementById('viewport');
  const flashOverlay = document.getElementById('flashOverlay');
  const dot = document.getElementById('dot');
  const statusEl = document.getElementById('status');
  const cueTag = document.getElementById('cueTag');

  // Load YouTube API
  const tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);

  function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
      events: {
        'onReady': () => {
          statusEl.textContent = isIOS ? "Engine: iOS Taptic Ready" : "Engine: Ready";
        },
        'onStateChange': onStateChange
      }
    });
  }

  // Cross-Platform Haptic Dispatcher
  function fireHaptic(cue) {
    // 1. Android physical vibration
    if (hasAndroidHaptics) {
      try { navigator.vibrate(cue.vibe); } catch(e){}
    }

    // 2. iOS Taptic Engine Driver (Triggers system switch haptic burst)
    if (isIOS && tapticLabel) {
      for (let i = 0; i < cue.pulses; i++) {
        setTimeout(() => {
          tapticLabel.click();
        }, i * 70);
      }
    }

    // 3. F1-Style Visual camera shake & light bursts
    viewport.classList.remove('shake-impact', 'shake-pulse');
    flashOverlay.className = 'flash-overlay';
    void viewport.offsetWidth; // Force reflow

    if (cue.fx === 'impact') viewport.classList.add('shake-impact');
    if (cue.fx === 'pulse') viewport.classList.add('shake-pulse');

    if (cue.flash === 'white') {
      flashOverlay.classList.add('flash-white');
      setTimeout(() => flashOverlay.classList.remove('flash-white'), 110);
    } else if (cue.flash === 'cyan') {
      flashOverlay.classList.add('flash-cyan');
      setTimeout(() => flashOverlay.classList.remove('flash-cyan'), 130);
    }

    // HUD Telemetry blip
    dot.classList.add('active');
    cueTag.textContent = cue.tag;
    setTimeout(() => dot.classList.remove('active'), 180);
  }

  // 60FPS sync engine
  function runSyncLoop() {
    if (!player || typeof player.getCurrentTime !== 'function') return;

    try {
      const now = player.getCurrentTime();

      sfxTrack.forEach(cue => {
        if (!cue.triggered && now >= cue.time && now < cue.time + 0.12) {
          fireHaptic(cue);
          cue.triggered = true;
        }
        if (now < cue.time - 0.25) {
          cue.triggered = false;
        }
      });
    } catch(err){}

    syncClock = requestAnimationFrame(runSyncLoop);
  }

  function onStateChange(event) {
    if (event.data === YT.PlayerState.PLAYING) {
      statusEl.textContent = "HAPTICS SYNCED";
      if (!syncClock) syncClock = requestAnimationFrame(runSyncLoop);
    } else {
      if (syncClock) {
        cancelAnimationFrame(syncClock);
        syncClock = null;
      }
      statusEl.textContent = event.data === YT.PlayerState.PAUSED ? "PAUSED" : "STANDBY";
    }
  }
</script>

</body>
</html>
